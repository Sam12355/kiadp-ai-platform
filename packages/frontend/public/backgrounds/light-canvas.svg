<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1026" preserveAspectRatio="xMidYMid slice">
  <!--
    Light-theme page canvas: soft diagonal bands of near-white, cool-grey tinted.

    Vector rather than the source raster. The original is 7801x4001 — several megabytes,
    resampled at every viewport size — where this is under 2 KB and stays clean at any
    resolution. The composition is pure tone with no detail to lose, so nothing is
    sacrificed in the translation.

    Tonal range is roughly #ffffff to #e2e6ee: about six percent. That is the whole point.
    It sits behind an application, so a white card lifted by its shadow must still be the
    thing the eye lands on; anything more contrasty here would start competing with the
    content instead of seating it.
  -->
  <defs>
    <!-- Tone varies ACROSS the bands, i.e. along the top-left to bottom-right axis, which
         is perpendicular to the diagonal the bands themselves run along. -->
    <linearGradient id="bands" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#eef0f6"/>
      <stop offset="0.30" stop-color="#f6f8fb"/>
      <stop offset="0.45" stop-color="#fcfdfe"/>
      <stop offset="0.53" stop-color="#f4f6fa"/>
      <stop offset="0.66" stop-color="#eaeef4"/>
      <stop offset="0.84" stop-color="#e6eaf1"/>
      <stop offset="1"    stop-color="#e2e6ee"/>
    </linearGradient>

    <!-- The brighter fold in the upper right, fading out before it reaches the middle. -->
    <linearGradient id="fold" x1="1" y1="0" x2="0.15" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- A whisper of shade under the main diagonal, which is what makes the bands read as
         overlapping planes rather than as a flat gradient. -->
    <linearGradient id="shade" x1="0.55" y1="0" x2="0.75" y2="1">
      <stop offset="0"   stop-color="#c3cbdb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c3cbdb" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#c3cbdb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="1026" fill="url(#bands)"/>

  <!-- Upper-right fold -->
  <path d="M 1180 0 L 2000 0 L 2000 300 Z" fill="url(#fold)"/>

  <!-- Main diagonal: bright plane above, shaded plane below -->
  <path d="M 0 1026 L 2000 55 L 2000 250 L 150 1026 Z" fill="url(#shade)"/>
  <path d="M 0 790 L 2000 0 L 2000 45 L 0 900 Z" fill="#ffffff" opacity="0.55"/>
</svg>
